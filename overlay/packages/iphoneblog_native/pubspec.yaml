name: iphoneblog_native
description: "iOS glue for the iphoneblog build: APNs token and sign-in sheet, no Firebase."
version: 0.0.1
publish_to: 'none'

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: IphoneblogNativePlugin
