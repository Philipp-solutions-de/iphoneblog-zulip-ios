name: apple-ids

# Run once by hand before the first TestFlight build (docs/apple-setup.md, step 4):
# registers the app's bundle ids in the Apple team and turns on Push Notifications
# and App Groups, through the App Store Connect API key in the repository secrets.
# Safe to run again.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  register:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Register bundle ids and capabilities
        run: |
          BUNDLE_GEMFILE=fastlane/Gemfile bundle install
          BUNDLE_GEMFILE=fastlane/Gemfile bundle exec fastlane ios register_ids
