name: build

# Builds the zulip-flutter release pinned in config/app.env, on every push to main.
# When the repository variable TESTFLIGHT_ENABLED is "true", the same pinned release
# goes to TestFlight (docs/apple-setup.md).
#
# Security: the Apple secrets live only in the GitHub environment "apple", which
# accepts main alone, and only the testflight job binds it, on a push to main or a
# manual run on main. Code that is not on main never sees them: newer upstream
# releases are built without secrets by "upstream-bump" and arrive by pull request.
# No pull_request_target. Actions pinned by commit, fastlane by Gemfile.lock. The
# secret job installs Flutter fresh, without the shared cache.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build-app.yml

  testflight:
    needs: build
    if: >-
      vars.TESTFLIGHT_ENABLED == 'true' && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: macos-26
    timeout-minutes: 90
    environment: apple
    env:
      APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
      DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
      DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
      BUILD_NUMBER: ${{ github.run_number }}
      BUNDLE_GEMFILE: fastlane/Gemfile
      BUNDLE_FROZEN: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the pinned upstream release
        run: scripts/fetch-upstream.sh upstream >> "$GITHUB_ENV"
      - name: Install Flutter
        run: scripts/install-flutter.sh
      - name: Apply iphoneblog changes
        run: scripts/prepare.sh upstream
      - uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '4.0'
          bundler-cache: true
      - name: Build, sign and upload to TestFlight
        run: |
          (cd upstream && flutter build ios --config-only --release --build-number="$BUILD_NUMBER")
          bundle exec fastlane ios testflight_upload

  report-failure:
    needs: [build, testflight]
    if: failure()
    uses: ./.github/workflows/report-failure.yml
    permissions:
      issues: write
    with:
      what: "The build of the pinned release"
      upstream_tag: ${{ needs.build.outputs.upstream_tag }}
