name: build-app

# Reusable: fetch a zulip-flutter release, apply our changes, build for a device
# (unsigned) and the simulator, check for Google code, launch, screenshot.
# Gets no secrets. Called by "build" (the pinned release) and "upstream-bump"
# (the newest release).

on:
  workflow_call:
    inputs:
      upstream_tag:
        description: 'empty: the release pinned in config/app.env; "latest": the newest'
        type: string
        default: ''
    outputs:
      upstream_tag:
        value: ${{ jobs.build.outputs.upstream_tag }}
      upstream_commit:
        value: ${{ jobs.build.outputs.upstream_commit }}

permissions:
  contents: read

defaults:
  run:
    shell: bash -euo pipefail {0}

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      upstream_tag: ${{ steps.upstream.outputs.UPSTREAM_TAG }}
      upstream_commit: ${{ steps.upstream.outputs.UPSTREAM_COMMIT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch upstream release
        id: upstream
        env:
          WANTED_TAG: ${{ inputs.upstream_tag }}
          GH_TOKEN: ${{ github.token }}
        run: scripts/fetch-upstream.sh upstream "$WANTED_TAG" | tee -a "$GITHUB_ENV" >> "$GITHUB_OUTPUT"

      - name: Cache Flutter at upstream's commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/flutter
          key: flutter-${{ env.FLUTTER_SHA }}-${{ runner.os }}-${{ runner.arch }}

      - name: Install Flutter
        run: scripts/install-flutter.sh

      - name: Apply iphoneblog changes
        run: scripts/prepare.sh upstream

      - name: Build for device (unsigned)
        working-directory: upstream
        run: flutter build ios --release --no-codesign --build-number="$GITHUB_RUN_NUMBER"

      - name: Check that no Firebase or Google code shipped
        run: scripts/check-no-google.sh upstream upstream/build/ios/iphoneos/Runner.app

      - name: Build for the simulator
        working-directory: upstream
        run: flutter build ios --simulator --debug --dart-define=IPHONEBLOG_DENY_PUSH_PROMPT=true --build-number="$GITHUB_RUN_NUMBER"

      - name: Launch in the simulator and take a screenshot
        run: scripts/simulator-smoke.sh upstream/build/ios/iphonesimulator/Runner.app screenshot.png

      - name: Upload simulator app and screenshot
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: iphoneblog-z-${{ env.UPSTREAM_TAG }}-simulator
          path: |
            upstream/build/ios/iphonesimulator/Runner.app
            screenshot.png
          if-no-files-found: ignore
